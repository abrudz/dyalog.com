copyright: >
  Copyright © 2004 – 2026 Dyalog Ltd. Minchens Court, Minchens Lane, Bramley,
  Hampshire RG26 5BH, U.K. Company Number 05322189 (registered in England and
  Wales). VAT Number GB812257648.

extra:
  generator: false
  social:
    - icon: simple/bluesky
      link: https://bsky.app/profile/dyalog.bsky.social
      name: Dyalog on Bluesky
    - icon: fontawesome/brands/mastodon
      link: https://mastodon.social/@dyalog
      name: Dyalog on Mastodon
    - icon: fontawesome/brands/linkedin
      link: http://www.linkedin.com/company/dyalog-ltd-
      name: Dyalog on LinkedIn
    - icon: fontawesome/brands/instagram
      link: https://www.instagram.com/dyalogapl
      name: Dyalog on Instagram
    - icon: fontawesome/brands/facebook
      link: https://www.facebook.com/DyalogAPL
      name: Dyalog on Facebook
    - icon: fontawesome/brands/github
      link: https://github.com/Dyalog
      name: Dyalog on GitHub
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/@DyalogLtd
      name: Dyalog on YouTube

theme:
  name: material
  custom_dir: overrides
  logo: assets/dyalog-wordmark-logo.svg
  favicon: assets/dyalog-favicon.svg
  font: false   # self-hosted via @font-face in stylesheets/extra.css
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - content.code.copy
    - content.tabs.link
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/hero-grid.js

nav:
  - Learn: learn.md
  - Products: products.md
  - Pricing: pricing.md
  - For Business: business.md
  - Community and Resources: community.md
  - About Us: about.md

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
